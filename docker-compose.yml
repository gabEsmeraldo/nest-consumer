services:
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: consumer:latest
    deploy:
      replicas: 7
      restart_policy:
        condition: on-failure
    expose:
      - "3030"
    networks:
      - first-nest-network

  nginx:
    image: nginx:alpine
    ports:
      - "3030:3030"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - consumer
    networks:
      - first-nest-network

networks:
  first-nest-network:
    external: true