events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream consumers {
        least_conn;

        server consumer-consumer-1:3030;
        server consumer-consumer-2:3030;
        server consumer-consumer-3:3030;
        server consumer-consumer-4:3030;
        server consumer-consumer-5:3030;
        server consumer-consumer-6:3030;
        server consumer-consumer-7:3030;
    }

    server {
        listen 3030;

        location / {
            set $consumer http://consumers;

            proxy_pass $consumer;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
